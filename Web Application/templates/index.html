<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTalks — Rupiah Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <style>
        /* ── Page layout ─────────────────────────────────────── */
        main {
            min-height: calc(100vh - 56px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px 80px;
        }

        .app-wrap {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ── App header ──────────────────────────────────────── */
        .app-header { display: flex; flex-direction: column; gap: 6px; }

        .app-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--fg-2);
            margin: 0;
        }

        /* ── Tap zone ───────────────────────────────────────── */
        main {
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ── Toggle indicator ────────────────────────────────── */
        #toggle-btn {
            width: 100%;
            font-size: 1.8rem;
            font-weight: 600;
            padding: 20px;
            border-radius: var(--r-md);
            letter-spacing: -0.5px;
            pointer-events: none;
        }

        /* ── Video card ──────────────────────────────────────── */
        .video-card {
            background: var(--surface-1);
            border: 1px solid var(--hairline);
            border-radius: var(--r-xl);
            overflow: hidden;
            position: relative;
            aspect-ratio: 4/3;
            box-shadow: var(--shadow-inset);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── CV bounding box ─────────────────────────────────── */
        .cv-box {
            position: absolute;
            border: 2px solid var(--accent);
            box-shadow: 0 0 0 1px rgba(94,106,210,0.25), 0 0 20px rgba(94,106,210,0.15);
            pointer-events: none;
            z-index: 10;
            display: none;
            border-radius: var(--r-xs);
            transition: all 100ms var(--ease);
        }

        /* ── Status line ─────────────────────────────────────── */
        #status {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--fg-3);
            padding: 8px 14px;
            background: var(--surface-1);
            border: 1px solid var(--hairline);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-inset);
        }

        /* ── Result display (≈48pt — PRD WCAG requirement) ───── */
        #result-text {
            font-family: var(--font);
            font-size: 64px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -2px;
            color: var(--fg-3);
            padding: 28px 28px;
            background: var(--surface-1);
            border: 1px solid var(--hairline);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-inset);
            word-break: break-word;
            transition:
                color var(--duration) var(--ease),
                border-color var(--duration) var(--ease);
        }

        #result-text.valid {
            color: #4ade80;
            border-color: rgba(39,166,68,0.3);
        }

        #result-text.invalid {
            color: #f87171;
            border-color: rgba(239,68,68,0.3);
        }

        /* ── Responsive ──────────────────────────────────────── */
        @media (max-width: 480px) {
            .nav { padding: 0 16px; }
            main { padding: 32px 16px 64px; }
            #result-text { font-size: 48px; letter-spacing: -1.5px; padding: 20px; }
            .btn-xl { font-size: 1.2rem; padding: 12px 22px; }
        }
    </style>
</head>
<body>

<!-- ── Navigation ──────────────────────────────────────────────── -->
<nav class="nav">
    <div class="nav-left">
        <a href="{{ url_for('index') }}" class="nav-brand">
            MoneyTalks
        </a>
    </div>
    <div class="nav-right">
        <a href="{{ url_for('test_page') }}" class="btn btn-secondary" style="font-size:13px; padding:6px 12px;">Test Upload</a>
        <a href="{{ url_for('admin_login') }}" class="btn btn-outline"    style="font-size:13px; padding:6px 12px;">Admin</a>
    </div>
</nav>

<!-- ── Main ────────────────────────────────────────────────────── -->
<main>
    <div class="app-wrap">

        <div class="app-header">
            <span class="eyebrow">Computer Vision · IDR Detector</span>
            <p class="app-title">Arahkan uang kertas Rupiah ke kamera.</p>
        </div>

        <!-- Toggle indicator -->
        <button id="toggle-btn" class="btn btn-primary" aria-hidden="true">
            Mulai
        </button>

        <!-- Camera feed -->
        <div class="video-card">
            <video id="camera-stream" autoplay playsinline aria-hidden="true"></video>
            <div id="cv-box" class="cv-box"></div>
        </div>

        <!-- Status (polite ARIA live region for screen readers) -->
        <div id="status" role="status" aria-live="polite">Kamera siap digunakan.</div>

        <!-- Result (assertive ARIA live — announced immediately) -->
        <div id="result-text" aria-live="assertive">Belum Dideteksi</div>

    </div>
</main>

<span class="sr-only" id="sr-announce" aria-live="assertive"></span>

<script>
    const video      = document.getElementById("camera-stream");
    const toggleBtn  = document.getElementById("toggle-btn");
    const resultText = document.getElementById("result-text");
    const statusText = document.getElementById("status");

    let stream            = null;
    let detectionInterval = null;
    let lastDetectedLabel = "";
    let _ttsAudio         = null;
    let isRunning         = false;

    document.querySelector("main").addEventListener("click", (e) => {
        if (e.target.closest("a")) return;
        if (isRunning) stopCamera();
        else startCamera();
    });

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
            video.srcObject = stream;
            isRunning = true;
            toggleBtn.innerText = "Berhenti";
            toggleBtn.classList.remove("btn-primary");
            toggleBtn.classList.add("btn-secondary");
            statusText.innerText = "Kamera aktif. Sedang memproses gambar...";

            // PRD: capture frame every 1 second
            detectionInterval = setInterval(captureAndSendFrame, 1000);
            speakOut("Kamera aktif. Mengambil gambar.");
            lastDetectedLabel = "";
        } catch (err) {
            console.error("Camera access error:", err);
            statusText.innerText = "Gagal mengakses kamera. " + err.message;
            speakOut("Gagal mengakses kamera.");
        }
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
        clearInterval(detectionInterval);
        isRunning = false;
        toggleBtn.innerText = "Mulai";
        toggleBtn.classList.remove("btn-secondary");
        toggleBtn.classList.add("btn-primary");
        statusText.innerText = "Kamera dinonaktifkan.";
        resultText.innerText = "Belum Dideteksi";
        resultText.className = "";
        document.getElementById("cv-box").style.display = "none";
        speakOut("Kamera dimatikan.");
    }

    function speakOut(text) {
        if (window.speechSynthesis) {
            if (window.speechSynthesis.speaking) return;
            const utt = new SpeechSynthesisUtterance(text);
            utt.lang = "id-ID";
            utt.rate = 1.0;
            window.speechSynthesis.speak(utt);
        } else {
            // Fallback: gTTS server-side
            if (_ttsAudio && !_ttsAudio.paused) return;
            _ttsAudio = new Audio("/api/tts?text=" + encodeURIComponent(text));
            _ttsAudio.play().catch(() => {});
        }
    }

    // FR-04: upload with exponential-backoff retry (500ms → 1s → 2s)
    async function uploadScan(blob, denomination, confidence) {
        const BACKOFF = [500, 1000, 2000];
        for (let i = 0; i < BACKOFF.length; i++) {
            try {
                const fd = new FormData();
                fd.append("frame", blob, "scan.jpg");
                fd.append("denomination", denomination);
                fd.append("confidence", confidence);
                const r = await fetch("/api/upload-image", { method: "POST", body: fd });
                if (r.ok) return;
            } catch (_) {}
            if (i < BACKOFF.length - 1)
                await new Promise(res => setTimeout(res, BACKOFF[i]));
        }
    }

    async function captureAndSendFrame() {
        if (!video.videoWidth) return;

        const canvas = document.createElement("canvas");
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append("frame", blob, "frame.jpg");

            try {
                const response = await fetch("/api/detect", { method: "POST", body: formData });
                if (!response.ok) throw new Error("API error");

                const data = await response.json();
                const cvBox = document.getElementById("cv-box");

                // Draw bounding box
                if (data.box && data.box.length === 4 && data.box[2] > 0) {
                    cvBox.style.display = "block";
                    cvBox.style.left   = (data.box[0] * 100) + "%";
                    cvBox.style.top    = (data.box[1] * 100) + "%";
                    cvBox.style.width  = (data.box[2] * 100) + "%";
                    cvBox.style.height = (data.box[3] * 100) + "%";
                } else {
                    cvBox.style.display = "none";
                }

                if (data.valid) {
                    resultText.innerText   = data.message;
                    resultText.className   = "valid";
                    statusText.innerText   = "Terdeteksi — confidence " + (data.confidence * 100).toFixed(1) + "%";

                    if (lastDetectedLabel !== data.message || !window.speechSynthesis?.speaking) {
                        speakOut(data.message);
                        lastDetectedLabel = data.message;
                    }

                    // Fire-and-forget upload
                    uploadScan(blob, data.raw_label, data.confidence).catch(() => {});
                } else {
                    resultText.innerText   = data.message;
                    resultText.className   = "invalid";
                    statusText.innerText   = "Tidak terdeteksi.";
                    speakOut(data.message);
                    lastDetectedLabel = "";
                }
            } catch (e) {
                console.error("Inference error:", e);
            }
        }, "image/jpeg", 0.85);
    }
</script>

</body>
</html>
